[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sconce"
version = "1.0.3"
description = "sconce: Compression and Deployment made Easy"
authors = [{ name = "Sathyaprakash Narayanan", email = "snaray17@ucsc.edu" }]
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
keywords = ["sconce", "model-compression", "pruning", "quantization", "pytorch"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.7.0,<4.0.0",
    "numpy>=1.17",
    "onnx",
    "onnxruntime",
    "pandas",
    "prettytable",
    "torch>=2.12,<2.13",
    "torch-pruning",
    "torchprofile>=0.0.4",
    "torchsummary",
    "tqdm>=4.66.1",
]

[project.urls]
Code = "https://github.com/satabios/sconce"
Documentation = "https://sconce.readthedocs.io/"

[project.optional-dependencies]
dev = [
    "black>=23.11.0",
    "flake8>=6.1.0",
    "pytest>=7.4.3",
]
docs = [
    "sphinx>=7.1,<8",
    "sphinx-rtd-theme>=1.3.0",
    "sphinxcontrib-jquery>=4.1",
]
snn = [
    "snntorch>=0.7.0",
]
experiments = [
    "bitsandbytes",
    "datasets",
    "fast-pytorch-kmeans",
    "huggingface-hub>=0.17.3",
    "ipykernel>=6.26.0",
    "jupyter>=1.0.0",
    "nvidia-ml-py>=13.0.0",
    "timm",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.27,<0.28",
    "transformers>=5.9,<6",
]

[dependency-groups]
dev = [
    "black>=23.11.0",
    "flake8>=6.1.0",
    "pytest>=7.4.3",
]
docs = [
    "sphinx>=7.1,<8",
    "sphinx-rtd-theme>=1.3.0",
    "sphinxcontrib-jquery>=4.1",
]
snn = [
    "snntorch>=0.7.0",
]
experiments = [
    "bitsandbytes",
    "datasets",
    "fast-pytorch-kmeans",
    "huggingface-hub>=0.17.3",
    "ipykernel>=6.26.0",
    "jupyter>=1.0.0",
    "nvidia-ml-py>=13.0.0",
    "timm",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.27,<0.28",
    "transformers>=5.9,<6",
]

[tool.setuptools.packages.find]
include = ["sconce*"]
