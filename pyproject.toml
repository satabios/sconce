[build-system]
requires = ["setuptools<60.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sconce"
version = "v1.0.3"
description = "sconce: Compression and Deployment made Easy"
authors = [{ name = "Sathyaprakash Narayanan", email = "snaray17@ucsc.edu" }]
urls = { code = "https://github.com/satabios/sconce" }

requires-python = ">=3.8"
dynamic = ["dependencies", "readme", "classifiers", "keywords", "license"]
